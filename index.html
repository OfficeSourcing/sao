<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8ecfb">
<title>แบบสอบถามการย้ายที่ทำการ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e8ecfb}

/* กรอบ iframe เต็มจอ เว้นขอบตามรอยบากของมือถือ (สีพื้นเดียวกับแอป จึงไม่เห็นเป็นขอบ) */
#app{
  position:fixed;top:0;left:0;width:100%;
  height:100vh;height:100dvh;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
#frame{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s ease}
#frame.show{opacity:1}

/* หน้า loading */
#loader{
  position:fixed;top:0;left:0;width:100%;
  height:100vh;height:100dvh;z-index:10;
  background:#e8ecfb;color:#14173a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  font-family:'Prompt',sans-serif;text-align:center;padding:20px;box-sizing:border-box;
  transition:opacity .5s ease,visibility .5s ease;
}
#loader.out{opacity:0;visibility:hidden}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #d6dcfa;border-top-color:#2b3cf0;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{margin:0;font-size:15px;font-weight:500}
#slow{font-size:13px;color:#6b7094;font-weight:400}
#slow a{color:#2b3cf0}
</style>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <p>กำลังโหลด...</p>
  <p id="slow" hidden>ใช้เวลานานกว่าปกติ <a href="" onclick="location.reload();return false">โหลดใหม่</a></p>
</div>

<div id="app">
  <iframe id="frame" title="แบบสอบถามการย้ายที่ทำการ" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<noscript><p style="padding:20px;font-family:sans-serif">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานระบบนี้</p></noscript>

<script>
// ▼▼▼ วาง URL เว็บแอป (ที่ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' ' ▼▼▼
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxO4bN7IEPab3Hs7LSVYFrOyJeTD_PvnqCZY6L6P-icWb3UonskOXOFNJVdGxWg2YNLlA/exec';
// ▲▲▲ ----------------------------------------------------------- ▲▲▲

const frame = document.getElementById('frame');
const loader = document.getElementById('loader');

// เปิดหน้าหลังบ้านด้วย  โดเมนของคุณ/?page=admin
const isAdmin = new URLSearchParams(location.search).get('page') === 'admin';
frame.src = EXEC_URL + (isAdmin ? '?page=admin' : '');

// เมื่อ iframe โหลดเสร็จ ให้ loading จางหาย (แสดงอย่างน้อย 0.6 วินาที กันกะพริบ)
const t0 = Date.now();
frame.addEventListener('load', function () {
  const wait = Math.max(0, 600 - (Date.now() - t0));
  setTimeout(function () {
    frame.classList.add('show');
    loader.classList.add('out');
    setTimeout(function () { loader.remove(); }, 700);
  }, wait);
});

// ถ้าโหลดเกิน 15 วินาที ให้ขึ้นข้อความแจ้ง
setTimeout(function () {
  const s = document.getElementById('slow');
  if (s) s.hidden = false;
}, 15000);
</script>
</body>
</html>
